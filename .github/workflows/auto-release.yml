name: Auto Release (velocity-beritab1)

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Read version
        id: ver
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compare with latest release tag
        id: cmp
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CUR: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/releases/latest" || true)"
          latest_tag="$(printf '%s' "$response" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.tag_name||'')}catch(e){console.log('')}})")"

          latest="${latest_tag#v}"
          current="${CUR#v}"

          if [ -z "$latest" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          top="$(printf '%s\n%s\n' "$latest" "$current" | sort -V | tail -n1)"
          if [ "$top" = "$current" ] && [ "$current" != "$latest" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.cmp.outputs.should_release == 'true'
        run: npm ci

      - name: Build package
        if: steps.cmp.outputs.should_release == 'true'
        run: npm run build

      - name: Create GitHub Release
        if: steps.cmp.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/velocity-beritab1-${{ steps.ver.outputs.version }}.zip
